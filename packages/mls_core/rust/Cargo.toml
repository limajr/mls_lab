[package]
name = "mls_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = { version = "0.6", features = ["clonable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
