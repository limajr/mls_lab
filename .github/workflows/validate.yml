name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Rust and Dart tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$(cat packages/mls_core/rust/rust-toolchain)" --profile minimal --component clippy --component rustfmt
          rustup default "$(cat packages/mls_core/rust/rust-toolchain)"
      - name: Install pinned Flutter and Dart
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Rust format, tests, and clippy
        working-directory: packages/mls_core/rust
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Dart analysis and native integration tests
        working-directory: packages/mls_core
        run: |
          dart pub get
          dart analyze
          dart test --reporter expanded
          dart run example/mls_core_example.dart

  macos:
    name: Flutter app (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$(cat packages/mls_core/rust/rust-toolchain)" --profile minimal
          rustup default "$(cat packages/mls_core/rust/rust-toolchain)"
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Analyze, test, and build the macOS app
        working-directory: apps/mls_demo
        run: |
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
          flutter build macos --release
